version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ramad_postgres
    restart: always
    environment:
      POSTGRES_USER: ramad_user
      POSTGRES_PASSWORD: ramad_secure_password
      POSTGRES_DB: ramad_mador
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: ramad_backend
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg2://ramad_user:ramad_secure_password@postgres:5432/ramad_mador
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-2.0-flash}
      GEMINI_REASONING_MODEL: ${GEMINI_REASONING_MODEL:-gemini-2.0-pro-exp-02-05}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-ramad_evolution_key}
      RAMAD_PHONE_NUMBER: ${RAMAD_PHONE_NUMBER}
    ports:
      - "8000:8000"

  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: ramad_evolution_api
    restart: always
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-ramad_evolution_key}
      DATABASE_ENABLED: "false"
      WEBHOOK_GLOBAL_URL: http://backend:8000/api/whatsapp/webhook
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  evolution_instances:
