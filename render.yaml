services:
  # Web Service for Ramad Copilot FastAPI + Multi-Agent Backend
  - type: web
    name: ramad-copilot-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: frankfurt
    envVars:
      - key: PORT
        value: 8000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_PRO_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_REASONING_MODEL
        value: gemini-3.8-flash
      - key: DATABASE_URL
        fromDatabase:
          name: ramad-mador-db
          property: connectionString
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: RAMAD_PHONE_NUMBER
        sync: false

databases:
  # Managed PostgreSQL on Render
  - name: ramad-mador-db
    plan: starter
    region: frankfurt
    databaseName: ramad_mador
    user: ramad_user
